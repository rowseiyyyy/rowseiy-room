<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rosemay's Room — Portfolio</title>
<link rel="icon" type="image/png" href="images/portfolio-logo.png" />
<link rel="apple-touch-icon" href="images/portfolio-logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <img class="loading-logo" src="images/portfolio-logo.png" alt="" width="72" height="72">
      <div class="loading-dots" role="status" aria-label="Loading">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <!-- Welcome toast -->
  <div id="welcome-toast" class="welcome-toast" role="status">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align: middle; margin-right: 4px;">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
    </svg>
    Welcome to my little dev room! Click around to explore.
  </div>

  <!-- 3D canvas -->
  <canvas id="scene-canvas" aria-label="Interactive 3D developer room"></canvas>

  <!-- Top bar controls -->
  <div class="top-bar">
    <div class="brand">
      <img class="brand-logo" src="images/portfolio-logo.png" alt="">
      <span>Rosemay's Room</span>
    </div>
    <div class="controls">
      <button id="music-toggle" class="icon-btn" aria-pressed="false" aria-label="Toggle background music">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Zm4 4 5 6m0-6-5 6"/>
        </svg>
      </button>
      <button id="daynight-toggle" class="icon-btn" aria-label="Toggle day and night mode">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Hover hint -->
  <div id="hover-hint" class="hover-hint" aria-hidden="true"></div>

  <!-- Mobile nav fallback: also acts as accessible object list -->
  <nav class="object-nav" aria-label="Room navigation">
    <button data-target="laptop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <rect x="3" y="4" width="18" height="13" rx="2"/>
        <path d="M2 21h20l-2-4H4l-2 4Z"/>
      </svg>
      Projects
    </button>
    <button data-target="bookshelf">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/>
        <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8"/>
      </svg>
      Skills
    </button>
    <button data-target="console">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <path d="M7 8h10a5 5 0 0 1 4.8 6.4l-.7 2.4a2 2 0 0 1-3.2 1L15 15H9l-2.9 2.8a2 2 0 0 1-3.2-1l-.7-2.4A5 5 0 0 1 7 8Z"/>
        <path d="M8 10v4m-2-2h4m6-1h.01M18 13h.01"/>
      </svg>
      Hobbies
    </button>
    <button data-target="frame">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      About
    </button>
    <button data-target="notes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <path d="m2 8 10-5 10 5-10 5-10-5Z"/>
        <path d="M6 10v5c3.5 3 8.5 3 12 0v-5m4-2v7"/>
      </svg>
      Education
    </button>
    <button data-target="cat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <path d="m4 10 1-6 5 3h4l5-3 1 6a8 8 0 1 1-16 0Z"/>
        <path d="M9 11h.01M15 11h.01M9 15c1.7 1.3 4.3 1.3 6 0"/>
      </svg>
      Fun Facts
    </button>
    <button data-target="plants">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <path d="M12 21v-9"/>
        <path d="M12 13C5 13 4 8 4 4c5 0 9 2 9 8m-1 3c0-5 3-8 8-8 0 5-2 9-8 9"/>
      </svg>
      Learning
    </button>
    <button data-target="phone">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 1rem; height: 1rem;">
        <path d="M7 3h10v18H7z"/>
        <path d="M10 6h4m-4 12h4"/>
      </svg>
      Contact
    </button>
  </nav>

  <!-- Portfolio overlay -->
  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="overlay-backdrop" id="overlay-backdrop"></div>
    <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <button class="overlay-close" id="overlay-close" aria-label="Close panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
      <div id="overlay-content" class="overlay-content">
        <!-- injected by portfolio.js -->
      </div>
    </div>
  </div>

  <audio id="bg-music" loop preload="none">
    <!-- Add your own royalty-free track here, e.g. src="assets/audio/lofi.mp3" -->
  </audio>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/portfolio-data.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/room.js"></script>
<script src="js/realism.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
